<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3ea898"/>
    </marker>
    <filter id="shadow" x="-3%" y="-5%" width="106%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Canvas: Deep Timber Slate -->
  <rect x="1" y="1" width="898" height="498" rx="14" fill="#1b1917" stroke="#38322c" stroke-width="2"/>

  <!-- Layer Labels -->
  <g fill="#928b80" font-size="11" font-weight="700" letter-spacing="1.5">
    <text x="36" y="70">APPLICATION</text>
    <text x="36" y="180">RUNTIME</text>
    <text x="36" y="300">SUBSYSTEMS</text>
    <text x="36" y="430">FOUNDATION</text>
  </g>

  <!-- Application Layer -->
  <g filter="url(#shadow)">
    <rect x="170" y="30" width="692" height="70" rx="10" fill="#2d231b" stroke="#d88e49" stroke-width="1.5"/>
    <text x="516" y="60" text-anchor="middle" fill="#faf6ee" font-size="17" font-weight="700">OTTERUS_EDITOR</text>
    <text x="516" y="82" text-anchor="middle" fill="#d8c5b0" font-size="13">Host application and tooling workspace</text>
  </g>

  <!-- Runtime Layer -->
  <g filter="url(#shadow)">
    <rect x="170" y="140" width="692" height="70" rx="10" fill="#1e332f" stroke="#3ea898" stroke-width="1.5"/>
    <text x="516" y="170" text-anchor="middle" fill="#faf6ee" font-size="17" font-weight="700">OTTERUS_CORE</text>
    <text x="516" y="192" text-anchor="middle" fill="#a8ded5" font-size="13">Game logic, entities, resource management and scripting bridge</text>
  </g>

  <!-- Subsystems Layer -->
  <g stroke="#3e372f" stroke-width="1.5" fill="#24211e" filter="url(#shadow)">
    <rect x="170" y="250" width="161" height="90" rx="10"/>
    <rect x="347" y="250" width="161" height="90" rx="10"/>
    <rect x="524" y="250" width="161" height="90" rx="10"/>
    <rect x="701" y="250" width="161" height="90" rx="10"/>
  </g>
  <g text-anchor="middle" fill="#faf6ee" font-size="14" font-weight="700">
    <text x="250" y="286">WINDOW</text>
    <text x="427" y="286">RENDERING</text>
    <text x="604" y="286">PHYSICS</text>
    <text x="781" y="286">SOUND</text>
  </g>
  <g text-anchor="middle" fill="#a49a8d" font-size="12">
    <text x="250" y="310">Windowing</text>
    <text x="250" y="326">and input</text>
    <text x="427" y="310">2D batch</text>
    <text x="427" y="326">graphics pipeline</text>
    <text x="604" y="310">Physics world</text>
    <text x="604" y="326">and contacts</text>
    <text x="781" y="310">Multi-channel</text>
    <text x="781" y="326">audio playback</text>
  </g>

  <!-- Foundation Layer -->
  <g stroke="#38322c" stroke-width="1.5" fill="#211e1c" filter="url(#shadow)">
    <rect x="170" y="390" width="338" height="70" rx="10"/>
    <rect x="524" y="390" width="338" height="70" rx="10"/>
  </g>
  <g text-anchor="middle" fill="#eae4d8" font-size="14" font-weight="700">
    <text x="339" y="420">LOGGER</text>
    <text x="693" y="420">UTILITIES</text>
  </g>
  <g text-anchor="middle" fill="#928b80" font-size="12">
    <text x="339" y="441">Diagnostic logging and console sinks</text>
    <text x="693" y="441">Timing, random generation, and RAII helpers</text>
  </g>

  <!-- Connective Arrows -->
  <g stroke="#3ea898" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="516" y1="102" x2="516" y2="136"/>
    <line x1="516" y1="212" x2="516" y2="246"/>
    <line x1="516" y1="342" x2="516" y2="386"/>
  </g>
</svg>
