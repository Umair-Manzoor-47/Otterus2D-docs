<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3ea898"/>
    </marker>
    <filter id="shadow" x="-4%" y="-5%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background: Deep Timber Peat -->
  <rect width="960" height="380" fill="#1b1917" rx="12" stroke="#38322c" stroke-width="1.5"/>

  <!-- Title & Context -->
  <text x="36" y="38" fill="#faf6ee" font-size="18" font-weight="700">Frame Execution Lifecycle</text>
  <text x="36" y="58" fill="#928b80" font-size="13">High-level sequential pipeline executed each frame on the main thread</text>

  <!-- Stage 1: Input -->
  <g transform="translate(36, 85)" filter="url(#shadow)">
    <rect width="200" height="250" rx="8" fill="#23201d" stroke="#38322c" stroke-width="1.5"/>
    <rect width="200" height="38" rx="8" fill="#2d231b" stroke="#d88e49" stroke-width="1"/>
    <rect y="30" width="200" height="8" fill="#2d231b"/>
    <text x="100" y="24" text-anchor="middle" fill="#faf6ee" font-size="13" font-weight="700">1. INPUT</text>
    
    <g transform="translate(16, 56)" font-size="12" fill="#eae4d8">
      <text y="14" font-weight="700" fill="#e7a466">Event Polling</text>
      <text y="30" fill="#928b80">• Capture OS events</text>
      <text y="46" fill="#928b80">• Keyboard &amp; mouse state</text>
      <text y="62" fill="#928b80">• Handle quit requests</text>
      
      <line x1="0" y1="80" x2="168" y2="80" stroke="#38322c" stroke-width="1"/>
      
      <text y="100" font-weight="700" fill="#e7a466">State Dispatch</text>
      <text y="116" fill="#928b80">• Route input to editor UI</text>
      <text y="132" fill="#928b80">• Update Input Manager</text>
      <text y="148" fill="#928b80">• Dispatch key triggers</text>
    </g>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 238 210 L 268 210" stroke="#3ea898" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Logic & Simulation -->
  <g transform="translate(272, 85)" filter="url(#shadow)">
    <rect width="200" height="250" rx="8" fill="#23201d" stroke="#38322c" stroke-width="1.5"/>
    <rect width="200" height="38" rx="8" fill="#1e332f" stroke="#3ea898" stroke-width="1"/>
    <rect y="30" width="200" height="8" fill="#1e332f"/>
    <text x="100" y="24" text-anchor="middle" fill="#faf6ee" font-size="13" font-weight="700">2. LOGIC &amp; SIMULATION</text>
    
    <g transform="translate(16, 56)" font-size="12" fill="#eae4d8">
      <text y="14" font-weight="700" fill="#56c0b0">Script Execution</text>
      <text y="30" fill="#928b80">• Run gameplay scripts</text>
      <text y="46" fill="#928b80">• Update active game states</text>
      
      <line x1="0" y1="62" x2="168" y2="62" stroke="#38322c" stroke-width="1"/>
      
      <text y="80" font-weight="700" fill="#56c0b0">Physics Simulation</text>
      <text y="96" fill="#928b80">• Fixed-timestep step</text>
      <text y="112" fill="#928b80">• Resolve body contacts</text>
      
      <line x1="0" y1="126" x2="168" y2="126" stroke="#38322c" stroke-width="1"/>

      <text y="144" font-weight="700" fill="#56c0b0">Systems Update</text>
      <text y="160" fill="#928b80">• Sync spatial transforms</text>
      <text y="176" fill="#928b80">• Update animation states</text>
    </g>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 474 210 L 504 210" stroke="#3ea898" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Render (Offscreen FBO) -->
  <g transform="translate(508, 85)" filter="url(#shadow)">
    <rect width="200" height="250" rx="8" fill="#23201d" stroke="#38322c" stroke-width="1.5"/>
    <rect width="200" height="38" rx="8" fill="#1e332f" stroke="#3ea898" stroke-width="1"/>
    <rect y="30" width="200" height="8" fill="#1e332f"/>
    <text x="100" y="24" text-anchor="middle" fill="#faf6ee" font-size="13" font-weight="700">3. SCENE RENDERING</text>
    
    <g transform="translate(16, 56)" font-size="12" fill="#eae4d8">
      <text y="14" font-weight="700" fill="#56c0b0">Target Setup</text>
      <text y="30" fill="#928b80">• Bind offscreen buffer</text>
      <text y="46" fill="#928b80">• Clear color and depth</text>
      
      <line x1="0" y1="62" x2="168" y2="62" stroke="#38322c" stroke-width="1"/>
      
      <text y="80" font-weight="700" fill="#56c0b0">Batch Submission</text>
      <text y="96" fill="#928b80">• Layer-sorted 2D sprites</text>
      <text y="112" fill="#928b80">• Geometric primitives</text>
      <text y="128" fill="#928b80">• Font / UI elements</text>
      
      <line x1="0" y1="144" x2="168" y2="144" stroke="#38322c" stroke-width="1"/>

      <text y="162" font-weight="700" fill="#56c0b0">Pass Completion</text>
      <text y="178" fill="#928b80">• Flush batches to GPU</text>
    </g>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 710 210 L 740 210" stroke="#3ea898" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: Presentation -->
  <g transform="translate(744, 85)" filter="url(#shadow)">
    <rect width="180" height="250" rx="8" fill="#23201d" stroke="#38322c" stroke-width="1.5"/>
    <rect width="180" height="38" rx="8" fill="#2d231b" stroke="#d88e49" stroke-width="1"/>
    <rect y="30" width="180" height="8" fill="#2d231b"/>
    <text x="90" y="24" text-anchor="middle" fill="#faf6ee" font-size="13" font-weight="700">4. PRESENTATION</text>
    
    <g transform="translate(14, 56)" font-size="12" fill="#eae4d8">
      <text y="14" font-weight="700" fill="#e7a466">UI &amp; Workspace</text>
      <text y="30" fill="#928b80">• Draw editor overlays</text>
      <text y="46" fill="#928b80">• Scale viewport to fit</text>
      
      <line x1="0" y1="62" x2="152" y2="62" stroke="#38322c" stroke-width="1"/>
      
      <text y="80" font-weight="700" fill="#e7a466">Display Output</text>
      <text y="96" fill="#928b80">• Blit rendered scene</text>
      <text y="112" fill="#928b80">• Swap hardware buffers</text>
      
      <line x1="0" y1="126" x2="152" y2="126" stroke="#38322c" stroke-width="1"/>

      <text y="144" font-weight="700" fill="#e7a466">Post-Frame</text>
      <text y="160" fill="#928b80">• Reset staging caches</text>
      <text y="176" fill="#928b80">• Prepare next frame</text>
    </g>
  </g>
</svg>
