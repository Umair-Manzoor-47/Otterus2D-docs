<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- River & Trail Gradients -->
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ba99c" />
      <stop offset="100%" stop-color="#215e65" />
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d49b6a" />
      <stop offset="100%" stop-color="#8d5b36" />
    </linearGradient>
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#735238" />
      <stop offset="100%" stop-color="#4e3524" />
    </linearGradient>
    <linearGradient id="muzzleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#e2d7c5" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0e171f" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Engine Gear / Riverbed Pebble Ring -->
  <circle cx="100" cy="100" r="92" fill="#1b2631" stroke="url(#riverGrad)" stroke-width="4" filter="url(#softShadow)" />
  
  <!-- Subtle Gear / Stepping Stone Notches -->
  <g fill="#3ba99c" opacity="0.7">
    <rect x="96" y="4" width="8" height="8" rx="2" />
    <rect x="96" y="188" width="8" height="8" rx="2" />
    <rect x="4" y="96" width="8" height="8" rx="2" />
    <rect x="188" y="96" width="8" height="8" rx="2" />
    <rect x="32" y="32" width="7" height="7" rx="2" transform="rotate(45 35.5 35.5)" />
    <rect x="161" y="32" width="7" height="7" rx="2" transform="rotate(45 164.5 35.5)" />
    <rect x="32" y="161" width="7" height="7" rx="2" transform="rotate(45 35.5 164.5)" />
    <rect x="161" y="161" width="7" height="7" rx="2" transform="rotate(45 164.5 164.5)" />
  </g>

  <!-- River Water Waves (Bottom) -->
  <path d="M 20 130 C 50 115, 80 145, 110 130 C 140 115, 170 140, 180 130 L 180 170 C 160 185, 130 192, 100 192 C 70 192, 40 185, 20 170 Z" fill="url(#riverGrad)" opacity="0.85" />
  <path d="M 15 145 C 50 130, 85 160, 120 145 C 150 135, 175 155, 185 145 L 185 175 C 160 190, 130 192, 100 192 C 65 192, 35 188, 15 175 Z" fill="#1b494f" opacity="0.9" />

  <!-- Otter Mascot -->
  <!-- Ears -->
  <circle cx="58" cy="68" r="16" fill="#4e3524" />
  <circle cx="58" cy="68" r="9" fill="#d49b6a" />
  <circle cx="142" cy="68" r="16" fill="#4e3524" />
  <circle cx="142" cy="68" r="9" fill="#d49b6a" />

  <!-- Head / Face -->
  <ellipse cx="100" cy="98" rx="54" ry="46" fill="url(#furGrad)" />

  <!-- Cream Muzzle Area -->
  <ellipse cx="100" cy="112" rx="34" ry="24" fill="url(#muzzleGrad)" />

  <!-- Eyes -->
  <circle cx="78" cy="90" r="6" fill="#1a1410" />
  <circle cx="76" cy="88" r="2" fill="#ffffff" />
  <circle cx="122" cy="90" r="6" fill="#1a1410" />
  <circle cx="120" cy="88" r="2" fill="#ffffff" />

  <!-- Otter Nose -->
  <path d="M 94 104 C 94 100, 106 100, 106 104 C 106 109, 100 112, 100 112 C 100 112, 94 109, 94 104 Z" fill="#241b15" />

  <!-- Whiskers & Mouth -->
  <path d="M 100 112 L 100 118 M 100 118 Q 93 124 88 120 M 100 118 Q 107 124 112 120" stroke="#3d291c" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 76 112 L 56 110 M 76 116 L 54 118 M 124 112 L 144 110 M 124 116 L 146 118" stroke="#a38974" stroke-width="1.5" stroke-linecap="round" />

  <!-- Engine 2D Floating Badge -->
  <g transform="translate(100, 160)">
    <rect x="-42" y="-12" width="84" height="24" rx="12" fill="#15202b" stroke="url(#trailGrad)" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" fill="#f4ede2" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="1.5">2D ENGINE</text>
  </g>
</svg>
